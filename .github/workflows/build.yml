name: Build SouthWest-NG lavender + KernelSU (backslashxx)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Kernel branch"
        default: "main-legacy"
      ksu:
        description: "KernelSU variant"
        type: choice
        default: "backslashxx"
        options:
          - backslashxx
          - none

env:
  BASE_CONFIG: vendor/xiaomi/sdm660_defconfig
  DEVICE_FRAGMENT: vendor/xiaomi/lavender.config
  CLANG_REPO: https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r596125
  AK3_REPO: https://github.com/LavenderLabz/AnyKernel3

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h /

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 curl git

      - name: Get clang (r596125, same as LavenderLabz)
        run: |
          git clone --depth=1 "$CLANG_REPO" "$PWD/tc/clang"
          echo "$PWD/tc/clang/bin" >> $GITHUB_PATH
          "$PWD/tc/clang/bin/clang" --version | head -n1

      - name: Configure
        run: |
          mkdir -p out
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 "$BASE_CONFIG" "$DEVICE_FRAGMENT"

      - name: Add KernelSU (backslashxx)
        if: github.event.inputs.ksu == 'backslashxx'
        run: |
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -s master
          echo "CONFIG_KSU=y" >> out/.config
          echo "# CONFIG_KPROBES is not set" >> out/.config
          ls -la drivers | grep -i kernelsu || echo "WARNING: drivers/kernelsu not found"
          grep -l "ksu" fs/exec.c fs/open.c fs/stat.c 2>/dev/null || echo "NOTE: no ksu hooks found in fs/*.c"

      - name: Build
        run: |
          ARGS=(O=out ARCH=arm64 CC=clang LD=ld.lld AS=llvm-as AR=llvm-ar NM=llvm-nm
                OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
                CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-
                LLVM=1 LLVM_IAS=1)
          make "${ARGS[@]}" olddefconfig
          make -j"$(nproc --all)" "${ARGS[@]}" Image.gz-dtb 2>&1 | tee build.log
          test -f out/arch/arm64/boot/Image.gz-dtb

      - name: Package with AnyKernel3
        run: |
          git clone -q --depth=1 -b master "$AK3_REPO" AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 "../SouthWest-NG-lavender-${{ github.event.inputs.ksu }}-$(date +%Y%m%d).zip" * -x .git README.md "*placeholder*"

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-zip
          path: SouthWest-NG-lavender-*.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
